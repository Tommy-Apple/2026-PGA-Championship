name: Fetch Golf Scores
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch and write scores
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: node fetch-scores.js
      - name: Keep workflow active
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          echo "$(date -u)" > .scores-last-run
          git add .scores-last-run
          git diff --staged --quiet || git commit -m "scores: $(date -u +%H:%M)" && git push origin main
