name: Fetch Golf Scores
on:
  schedule:
    - cron: '*/2 * * * *'
  workflow_dispatch:

jobs:
  fetch-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch ESPN scores and write to Firebase
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: |
          node << 'EOF'
          const https = require('https');

          function fetchURL(url) {
            return new Promise((resolve, reject) => {
              https.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => resolve(data));
              }).on('error', reject);
            });
          }

          function putToFirebase(url, data) {
            return new Promise((resolve, reject) => {
              const body = JSON.stringify(data);
              const urlObj = new URL(url);
              const options = {
                hostname: urlObj.hostname,
                path: urlObj.pathname + urlObj.search,
                method: 'PUT',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(body),
                },
              };
              const req = https.request(options, (res) => {
                let d = '';
                res.on('data', chunk => d += chunk);
                res.on('end', () => { console.log('Firebase response:', res.statusCode); resolve(d); });
              });
              req.on('error', reject);
              req.write(body);
              req.end();
            });
          }

          async function main() {
            const espnUrl = 'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard';
            const firebaseUrl = process.env.FIREBASE_URL;

            console.log('Fetching ESPN scores...');
            const raw = await fetchURL(espnUrl);
            const espnData = JSON.parse(raw);

            const competitors = espnData?.events?.[0]?.competitions?.[0]?.competitors || [];
            console.log(`Found ${competitors.length} players`);

            // Log first player to debug structure
            if (competitors.length > 0) {
              const first = competitors[0];
              console.log('Sample player:', JSON.stringify({
                name: first.athlete?.displayName,
                score: first.score,
                scoreDisplayValue: first.score?.displayValue,
                status: first.status?.type?.name,
              }, null, 2));
            }

            const scores = {};
            competitors.forEach(c => {
              const displayName = c.athlete?.displayName || '';
              const key = displayName.toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim();
              
              // Score is in c.score (string like "-3", "E", "+2")
              const scoreVal = c.score;
              let score = null;
              if (scoreVal === 'E' || scoreVal === 'Even') score = 0;
              else if (scoreVal) {
                const n = parseInt(scoreVal, 10);
                if (!isNaN(n)) score = n;
              }

              // Status
              const statusName = c.status?.type?.name || '';
              const statusDesc = c.status?.type?.description || '';
              
              // Thru holes - check multiple possible locations
              const thruVal = c.status?.thru || c.linescores?.[0]?.linescores?.length;
              let thruDisplay = '--';
              if (statusDesc === 'Final' || statusName === 'STATUS_FINISHED') {
                thruDisplay = 'F';
              } else if (thruVal) {
                thruDisplay = `Thru ${thruVal}`;
              }

              // Position
              const pos = c.status?.position?.displayValue || '';

              scores[key] = {
                score,
                missedCut: statusName.includes('CUT') || statusName.includes('MISSED'),
                withdrawn: statusName.includes('WD') || statusName.includes('WITHDRAWN'),
                thru: thruDisplay,
                position: pos,
                displayName,
                rawScore: scoreVal,
                rawStatus: statusName,
              };
            });

            // Log a few scores to verify
            const sampleKeys = Object.keys(scores).slice(0, 3);
            sampleKeys.forEach(k => console.log(`${k}:`, JSON.stringify(scores[k])));

            const payload = { scores, lastUpdated: new Date().toISOString() };

            console.log(`Writing ${Object.keys(scores).length} players to Firebase...`);
            await putToFirebase(`${firebaseUrl}/pga-scores-2026.json`, payload);
            console.log('Done!');
          }

          main().catch(e => { console.error(e); process.exit(1); });
          EOF
